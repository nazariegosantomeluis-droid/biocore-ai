[client]
# Tanda 1 de la fase 1 (2026-11-15): el menú es el de `st.navigation` (Inicio, Aprender, Practicar, Explorar,
# Ajustes), declarado en app/main.py. No hay carpeta pages/: Streamlit no lista ningún archivo por su cuenta.
showSidebarNavigation = true

[theme]
# Tanda 1 de la fase 1 (2026-11-15, decisiones 4-6): un solo tema (el oscuro) y estos tokens son COPIA de
# `PALETTE` en app/utils/design_system.py, la única fuente (Streamlit no lee Python); una prueba exige que coincidan
# y mide el contraste WCAG de cada par (`CONTRAST_PAIRS`). primaryColor pasó de #1d4ed8 (2.66:1 sobre el fondo: la
# pestaña activa no llegaba a AA) a #4f8ef7 (5.56:1). Con él, el texto blanco de un botón «primary» quedaría en
# 3.21:1, así que la app no usa botones `type="primary"` (otra prueba lo vigila).
# Tipografía: la sans-serif que Streamlit trae empaquetada (sin servicios externos).
base = "dark"
primaryColor = "#4f8ef7"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1a2a4a"
textColor = "#e0e7ff"
font = "sans-serif"
# Código en línea (`así`): el verde por defecto de Streamlit medía 4.42:1 sobre su fondo (no AA) y además es un
# color de estado. Se usa TEXT (con ACCENT_ON_DARK, dentro de un caption atenuado, medía 4.14:1).
codeTextColor = "#e0e7ff"
