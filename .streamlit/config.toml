[client]
# BIOCORE AI uses a single, curated hub-based navigation (Digital Twin OS +
# Learning/Clinical/Research/Simulation/AI/Hardware hubs) rendered inside
# app/main.py. Streamlit's automatic multipage sidebar — which lists every
# file in app/pages/ individually with no organization — is disabled so the
# 17 loose entries don't appear as a second, uncurated navigation surface.
showSidebarNavigation = false
# Rediseño visual (2026-10-19): sin el botón "Deploy" ni las opciones de
# desarrollador en la barra superior (no le sirven a quien usa la app); el
# menú principal (tema, imprimir, pantalla completa) se conserva.
toolbarMode = "minimal"

[theme]
# Tema base BIOCORE AI (2026-08-24, Capa 2 Fase 2.3 Tanda 1; rediseño visual
# 2026-10-19 con la guía UI UX Pro Max, estilo "Accessible & Ethical" para
# salud). Los colores de marca/fondo son los mismos tokens que
# app/utils/design_system.py (PALETTE) reutiliza por nombre.
#
# Contraste WCAG (fórmula estándar de luminancia relativa, verificado por
# cálculo, no a ojo):
#   textColor sobre backgroundColor:            14.49:1 (AAA)
#   textColor sobre secondaryBackgroundColor:   11.56:1 (AAA)
#   primaryColor como texto sobre el fondo:      5.70:1 (AA) -- pestaña
#     activa y valor de los sliders, que Streamlit pinta en este color
#     (el azul anterior #1d4ed8 daba 2.66:1 y no se leía)
#   primaryColor como texto en la barra lateral: 4.55:1 (AA)
#   palomita blanca sobre primaryColor:          3.13:1 (>= 3:1, WCAG 1.4.11)
#   texto oscuro sobre el botón primario:        5.70:1 (AA, ver inject_global_theme)
#   bordes de los controles (borderColor):       3.38:1 (>= 3:1, WCAG 1.4.11)
# primaryColor = teal #0891B2 de UI UX Pro Max ajustado a #099fbd para que
# un solo valor cumpla todo lo anterior en modo oscuro.
#   linkColor sobre el fondo:                    9.88:1 (AAA)
base = "dark"
primaryColor = "#099fbd"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1a2a4a"
textColor = "#e0e7ff"
linkColor = "#22d3ee"
borderColor = "#5d6b92"
showWidgetBorder = true
baseRadius = "0.625rem"
buttonRadius = "0.625rem"

# Tipografía (UI UX Pro Max): Figtree para títulos, Noto Sans para texto.
# Servidas desde app/static/fonts/ (sin internet). Escala de la tipografía
# clásica (36/24/21/18/16/14 px) sobre base de 16 px.
font = "Noto Sans, sans-serif"
headingFont = "Figtree, Noto Sans, sans-serif"
headingFontSizes = ["2.25rem", "1.5rem", "1.3125rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [700, 700, 600, 600, 600, 600]

# Paleta categórica de gráficos (Plotly/Altair/Vega): orden validado con el
# validador de la skill de dataviz sobre #0f172a, modo oscuro -- separación
# para daltonismo ΔE adyacente >= 8.4, visión normal >= 19.3, contraste
# >= 3:1 con el fondo. No repite los colores de estado clínico.
# Son 10 entradas porque los gráficos de Plotly de Streamlit 1.66 exigen
# exactamente 10 (con menos, ignoran la lista y usan su paleta por defecto:
# verificado con capturas). La 9 y la 10 repiten la 1 y la 2, igual que
# Streamlit haría al ciclar; ningún gráfico de la app usa más de 8 series.
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767", "#3987e5", "#d95926"]

[[theme.fontFaces]]
family = "Figtree"
url = "app/static/fonts/figtree-latin-wght-normal.woff2"
weight = "300 900"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Figtree"
url = "app/static/fonts/figtree-latin-ext-wght-normal.woff2"
weight = "300 900"
style = "normal"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "Noto Sans"
url = "app/static/fonts/noto-sans-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Noto Sans"
url = "app/static/fonts/noto-sans-latin-wght-italic.woff2"
weight = "100 900"
style = "italic"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Noto Sans"
url = "app/static/fonts/noto-sans-greek-wght-normal.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF"

[server]
# 2026-10-19: sin esto, la PRIMERA vez que se ejecuta Streamlit en una PC
# nueva pide un email en la consola y la app no arranca hasta que alguien
# presiona Enter. RUN_BIOCORE.bat / run_local.ps1 abren el navegador por su
# cuenta en cuanto el servidor responde; con `streamlit run` manual, abre la
# URL que se imprime (http://localhost:8501).
headless = true
# Solo esta computadora (127.0.0.1): sin aviso del Firewall de Windows y sin
# exponer la app en la red local. Para verla desde otro dispositivo de tu red:
#   python run_biocore.py --server.address 0.0.0.0
address = "127.0.0.1"
# Sirve app/static/ (las tipografías de [[theme.fontFaces]]).
enableStaticServing = true

[browser]
gatherUsageStats = false
